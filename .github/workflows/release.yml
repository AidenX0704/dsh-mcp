name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No cache: zero dependencies, no committed lockfile.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A tag that disagrees with package.json would publish a tarball whose
      # version does not match the release name, so fail before building.
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json"

      - name: Run the offline suites
        run: npm test

      - name: Pack the plugin
        run: npm pack

      # Release body: generated notes from merged PRs and commits
      # (generate_release_notes). CHANGELOG.md is hand-curated with Keep a
      # Changelog headings, and slicing it inside this workflow would need a
      # parser plus a fallback for tags that have no section yet; not worth the
      # fragility for a single-maintainer repo. Keep the changelog authoritative
      # for humans, let GitHub assemble the notes, and edit the release body by
      # hand when a tag deserves prose.
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-mcp-center-*.tgz
          generate_release_notes: true
