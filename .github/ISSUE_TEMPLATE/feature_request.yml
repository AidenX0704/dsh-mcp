name: Feature request
description: Suggest a capability or an improvement for MCP Center.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that MCP Center makes hard or impossible today? Describe the situation, not the implementation.
      placeholder: I keep several stdio servers per project and re-add their env vars by hand every time.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen instead? If you have a shape in mind (new field, new tab, new `/mcp` subcommand), sketch it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other ways this could be solved.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of the plugin would this touch?
      multiple: true
      options:
        - Panel (Configured / Marketplace / Invoke tabs)
        - Marketplace catalog (entries, categories, badges)
        - Slash command (`/mcp`)
        - Agent tool (`mcp_manager`)
        - Docs

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, links to MCP servers or specs, related issues.
    validations:
      required: false
